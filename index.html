<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#c0c0c0;font-family:'Courier New',monospace;font-size:14px;overflow-x:hidden;min-height:100vh}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
@media(max-width:768px){body{font-size:15px}}
</style>
</head>
<body>
<div id="app"></div>
<!-- SOURCE PROTECTION -->
<script>
if(window.top!==window.self){document.body.innerHTML='<h1 style="color:#ff1a1a;text-align:center;margin-top:20%;">ACCESS DENIED</h1>';}
document.addEventListener('contextmenu',function(e){if(!e.target.closest('input,textarea,[contenteditable]'))e.preventDefault();});
document.addEventListener('keydown',function(e){if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key.toUpperCase()))||(e.ctrlKey&&e.key==='U')){e.preventDefault();return false;}});
console.log('%c⚠ WARNING!','color:red;font-size:40px;');
console.log('%cThis is a private system. Unauthorized access is prohibited.','color:#ff0000;font-size:16px;');
</script>

</body>
</html>
